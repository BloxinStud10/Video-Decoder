<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video → RGBA Frames + MP3</title>
<style>
  :root { --bg:#14161a; --card:#1d2026; --fg:#e8eaed; --mut:#9aa0a6; --acc:#4f8cff; --bd:#2c3038; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f5f7; --card:#fff; --fg:#1b1d21; --mut:#6b7280; --bd:#dcdfe4; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; display:grid; gap:12px; }
  h1 { font-size:18px; margin:0; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label { display:grid; gap:4px; font-size:12px; color:var(--mut); }
  input[type=number], input[type=file] { width:100%; padding:8px; border-radius:6px; border:1px solid var(--bd); background:var(--bg); color:var(--fg); font-size:14px; }
  label.chk { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--fg); }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--acc); color:#fff; font-size:15px; cursor:pointer; }
  button.sec { background:var(--bd); color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  progress { width:100%; height:10px; }
  #info, #log { font-size:12px; color:var(--mut); white-space:pre-wrap; }
  video { display:none; }
  a.dl { display:inline-block; padding:8px 12px; border-radius:8px; background:var(--bd); color:var(--fg); text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Video → delta frames + MP3</h1>

  <div class="card">
    <label>Choose from Files / Downloads (mp4, webm, mov…)
      <input type="file" id="fileAny">
    </label>
    <label style="margin-top:8px">Or pick from Photo gallery
      <input type="file" id="file" accept="video/*">
    </label>
    <div id="info"></div>
  </div>

  <div class="card">
    <div class="grid">
      <label>Width (px)<input type="number" id="width" value="256" min="8" max="1920"></label>
      <label>Output FPS<input type="number" id="fps" value="40" min="1" max="120" step="0.01"></label>
      <label>Start (s)<input type="number" id="start" value="0" min="0" step="0.1"></label>
      <label>End (s, 0 = full)<input type="number" id="end" value="0" min="0" step="0.1"></label>
      <label>Max frames (0 = no limit)<input type="number" id="maxFrames" value="0" min="0"></label>
      <label>MP3 bitrate (kbps)<input type="number" id="bitrate" value="128" min="32" max="320" step="32"></label>
      <label>Pixel tolerance (0 = lossless, 0–255)<input type="number" id="tol" value="2" min="0" max="255" step="1"></label>
      <label>Keyframe every (frames)<input type="number" id="keyEvery" value="40" min="1" max="1000"></label>
      <label>Max part size (MB)<input type="number" id="partMB" value="20" min="1" max="500"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="chk"><input type="checkbox" id="audio" checked> Extract audio</label>
      <label class="chk"><input type="checkbox" id="mono"> Mono audio</label>
      <label class="chk"><input type="checkbox" id="lz4" checked> LZ4 compress frames</label>
      <label class="chk"><input type="checkbox" id="rgb" checked> Drop alpha (RGB, -25%)</label>
      <label class="chk"><input type="checkbox" id="zip" checked> Also make ZIP (slower)</label>
    </div>
    <div id="est" style="margin-top:8px;font-size:12px;color:var(--mut)"></div>
  </div>

  <div class="row">
    <button id="go" disabled>Convert</button>
    <button id="stop" class="sec" disabled>Cancel</button>
  </div>
  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="log"></div>
  <div class="row" id="out"></div>
</main>

<video id="v" muted playsinline preload="auto"></video>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const v = $('v');
let fileObj = null, objUrl = null, cancelled = false;

// ---------- helpers
const val = id => +$(id).value;
const even = n => Math.max(2, Math.round(n / 2) * 2);
const log = t => { $('log').textContent = t; };
const mb = b => (b / 1048576).toFixed(1) + ' MB';
const yieldUI = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
const sleep = ms => new Promise(r => setTimeout(r, ms));

function dims() {
  const w = even(val('width')), h = even(w * v.videoHeight / v.videoWidth);
  return { w, h };
}
function range() {
  const start = Math.max(0, val('start'));
  let end = val('end'); if (!(end > start) || end > v.duration) end = v.duration;
  return { start, end };
}
function frameTotal() {
  const { start, end } = range();
  let n = Math.floor((end - start) * val('fps'));
  const m = Math.floor(val('maxFrames')); if (m > 0) n = Math.min(n, m);
  return Math.max(0, n);
}
function estimate() {
  if (!v.videoWidth) return;
  const { w, h } = dims(), n = frameTotal();
  $('est').textContent = `${w}×${h}, ${n} frames, worst case ~${mb(w * h * ($('rgb').checked ? 3 : 4) * n)} (delta coding is usually far smaller)`;
}
['width','fps','start','end','maxFrames','rgb'].forEach(id => $(id).addEventListener('input', estimate));

// ---------- load
['file', 'fileAny'].forEach(id => $(id).addEventListener('change', e => {
  fileObj = e.target.files[0]; if (!fileObj) return;
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(fileObj);
  $('go').disabled = true; $('out').innerHTML = '';
  v.src = objUrl;
}));
v.addEventListener('loadedmetadata', () => {
  $('info').textContent = `${fileObj.name} · ${v.videoWidth}×${v.videoHeight} · ${v.duration.toFixed(2)}s · ${mb(fileObj.size)}`;
  $('go').disabled = false; estimate();
});
v.addEventListener('error', () => log('Browser cannot decode this video.'));

// ---------- frames
const seek = t => new Promise(res => {
  const done = () => { v.removeEventListener('seeked', done); res(); };
  v.addEventListener('seeked', done);
  v.currentTime = t;
});

// ---------- WebCodecs decoding (MP4/MOV via mp4box; falls back to seek loop otherwise)
const hasWC = () => 'VideoDecoder' in window && typeof MP4Box !== 'undefined';

function getDescription(mp4, track) {
  const trak = mp4.getTrackById(track.id);
  for (const e of trak.mdia.minf.stbl.stsd.entries) {
    const box = e.avcC || e.hvcC;
    if (box) {
      const s = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
      box.write(s);
      return new Uint8Array(s.buffer, 8);
    }
  }
  return undefined; // vp9 / av1 need no description
}

async function demux(file) {
  const mp4 = MP4Box.createFile();
  const samples = []; let track = null, err = null;
  mp4.onError = e => { err = e; };
  mp4.onReady = info => {
    track = info.videoTracks[0];
    if (track) { mp4.setExtractionOptions(track.id, null, { nbSamples: 1e6 }); mp4.start(); }
  };
  mp4.onSamples = (id, u, s) => { for (const x of s) samples.push(x); };
  const CH = 8 << 20;
  for (let o = 0; o < file.size; o += CH) {
    const b = await file.slice(o, o + CH).arrayBuffer();
    b.fileStart = o; mp4.appendBuffer(b);
  }
  mp4.flush();
  if (err || !track || !samples.length) throw new Error('demux failed');
  const m = track.matrix || [65536, 0];
  const rot = (Math.round(Math.atan2(m[1], m[0]) * 180 / Math.PI) + 360) % 360;
  return { mp4, track, samples, rot };
}

// Yields VideoFrames in presentation order, starting from the keyframe before startSec.
async function* decodeFrames(dm, startSec) {
  const { mp4, track, samples } = dm, ts = track.timescale;
  let first = 0;
  samples.forEach((s, i) => { if (s.is_sync && s.cts / ts <= startSec) first = i; });
  const q = []; let err = null, finished = false, stop = false;
  const dec = new VideoDecoder({ output: f => q.push(f), error: e => { err = e; } });
  dec.configure({
    codec: track.codec,
    codedWidth: track.video.width, codedHeight: track.video.height,
    description: getDescription(mp4, track),
  });
  (async () => {
    try {
      for (let i = first; i < samples.length && !err && !stop; i++) {
        while ((dec.decodeQueueSize > 16 || q.length > 8) && !err && !stop) await sleep(2);
        const s = samples[i];
        dec.decode(new EncodedVideoChunk({
          type: s.is_sync ? 'key' : 'delta',
          timestamp: Math.round(s.cts * 1e6 / ts),
          duration: Math.round(s.duration * 1e6 / ts),
          data: s.data,
        }));
      }
      if (!stop) await dec.flush();
    } catch (e) { err = err || e; }
    finished = true;
  })();
  try {
    for (;;) {
      if (q.length) yield q.shift();
      else if (err) throw err;
      else if (finished) return;
      else await sleep(1);
    }
  } finally {
    stop = true;
    q.forEach(f => f.close());
    if (dec.state !== 'closed') dec.close();
  }
}

function drawRotated(ctx, frame, w, h, rot) {
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(rot * Math.PI / 180);
  const sw = rot % 180 ? h : w, sh = rot % 180 ? w : h;
  ctx.drawImage(frame, -sw / 2, -sh / 2, sw, sh);
  ctx.restore();
}

/*
  video part files (video.bin, or video_001.bin, video_002.bin... when split).
  Parts are cut on frame boundaries and every part starts with a keyframe.
  Frame record (all u32 little-endian):
    u32 opCount
    opCount x { u32 skip, u32 lit, lit*bpp bytes }   bpp = 3 (RGB, alpha=255) or 4 (RGBA), see meta.rgb
  skip = pixels left unchanged since the previous frame, lit = pixels that follow.
  Keyframe = one op: skip 0, lit = every pixel. Unchanged frame = opCount 0.
  Each record is optionally LZ4 block-compressed (kept raw if LZ4 doesn't make it smaller).
  index.bin: per frame three u32: [offset inside its part, stored length, raw length].
  If stored length == raw length the record is raw, otherwise an LZ4 block.
  meta.parts[i] = { name, firstFrame, bytes }; frame f lives in the last part with firstFrame <= f.
  The encoder compares against what the decoder will have (recon), so lossy tolerance never drifts.
*/
function encodeFrame(px, recon, key, tol, rgb) {
  const n = px.length >> 2;
  const ops = []; let totalLit = 0;

  if (key) {
    ops.push(0, n); totalLit = n;
  } else {
    const p32 = new Uint32Array(px.buffer, px.byteOffset, n);
    const r32 = new Uint32Array(recon.buffer, 0, n);
    // fast path: identical 32-bit words are skipped without touching channels
    const changed = i => {
      if (p32[i] === r32[i]) return false;
      if (tol === 0) return true;
      const o = i * 4;
      return Math.abs(px[o] - recon[o]) > tol ||
             Math.abs(px[o + 1] - recon[o + 1]) > tol ||
             Math.abs(px[o + 2] - recon[o + 2]) > tol;
    };
    let i = 0, last = 0;
    while (i < n) {
      while (i < n && !changed(i)) i++;
      if (i >= n) break;
      const startPx = i; let end = i + 1, gap = 0;
      for (let j = i + 1; j < n; j++) {
        if (changed(j)) { end = j + 1; gap = 0; }
        else if (++gap > 2) break; // gaps of <=2 pixels are cheaper to just include
      }
      ops.push(startPx - last, end - startPx);
      totalLit += end - startPx; last = end; i = end;
    }
  }

  const out = new Uint8Array(4 + ops.length * 4 + totalLit * (rgb ? 3 : 4));
  const dv = new DataView(out.buffer);
  dv.setUint32(0, ops.length >> 1, true);
  let pos = 4, p = 0;
  for (let k = 0; k < ops.length; k += 2) {
    const skip = ops[k], lit = ops[k + 1];
    dv.setUint32(pos, skip, true); dv.setUint32(pos + 4, lit, true); pos += 8;
    p += skip;
    const a = p * 4, b = (p + lit) * 4;
    if (rgb) { for (let q = a; q < b; q += 4) { out[pos++] = px[q]; out[pos++] = px[q + 1]; out[pos++] = px[q + 2]; } }
    else { out.set(px.subarray(a, b), pos); pos += lit * 4; }
    recon.set(px.subarray(a, b), a);
    p += lit;
  }
  return out;
}

// Standard LZ4 block compressor (no frame header), compatible with llz4 / lz4decompress.
const lzTable = new Int32Array(1 << 16);
function lz4Block(src) {
  const n = src.length;
  const dst = new Uint8Array(n + ((n / 255) | 0) + 16);
  let d = 0, anchor = 0, i = 0;
  const writeLen = v => { while (v >= 255) { dst[d++] = 255; v -= 255; } dst[d++] = v; };
  if (n >= 13) {
    lzTable.fill(-1);
    const matchEnd = n - 5, last = n - 12;
    while (i <= last) {
      const seq = (src[i] | (src[i + 1] << 8) | (src[i + 2] << 16) | (src[i + 3] << 24)) >>> 0;
      const h = Math.imul(seq, 2654435761) >>> 16;
      const ref = lzTable[h]; lzTable[h] = i;
      if (ref >= 0 && i - ref <= 65535 &&
          src[ref] === src[i] && src[ref + 1] === src[i + 1] && src[ref + 2] === src[i + 2] && src[ref + 3] === src[i + 3]) {
        let m = 4;
        while (i + m < matchEnd && src[ref + m] === src[i + m]) m++;
        const lit = i - anchor, ml = m - 4, off = i - ref;
        dst[d++] = (Math.min(lit, 15) << 4) | Math.min(ml, 15);
        if (lit >= 15) writeLen(lit - 15);
        dst.set(src.subarray(anchor, i), d); d += lit;
        dst[d++] = off & 255; dst[d++] = off >> 8;
        if (ml >= 15) writeLen(ml - 15);
        i += m; anchor = i;
      } else i++;
    }
  }
  const lit = n - anchor;
  dst[d++] = Math.min(lit, 15) << 4;
  if (lit >= 15) writeLen(lit - 15);
  dst.set(src.subarray(anchor, n), d); d += lit;
  return dst.subarray(0, d);
}

// ---------- encode worker: delta + LZ4 + part splitting run off the main thread
const workerSrc = `
const lzTable = new Int32Array(1 << 16);
${encodeFrame}
${lz4Block}
let recon = null, partBytes = 0;
const pack = (rec, useLz4) => { if (useLz4) { const c = lz4Block(rec); if (c.length < rec.length) return c; } return rec; };
onmessage = e => {
  const m = e.data;
  if (m.init) { recon = new Uint8Array(m.size); partBytes = 0; return; }
  const px = new Uint8ClampedArray(m.buf);
  let rec = encodeFrame(px, recon, m.key, m.tol, m.rgb), stored = pack(rec, m.lz4), newPart = false;
  if (partBytes > 0 && partBytes + stored.length > m.maxPart) {
    newPart = true; partBytes = 0;
    if (!m.key) { rec = encodeFrame(px, recon, true, m.tol, m.rgb); stored = pack(rec, m.lz4); } // every part starts on a keyframe
  }
  const offset = partBytes; partBytes += stored.length;
  const out = stored.byteLength === stored.buffer.byteLength ? stored : stored.slice();
  postMessage({ n: m.n, stored: out, rawLen: rec.length, newPart, offset }, [out.buffer]);
};`;

// ---------- parallel path: each worker decodes + scales + encodes its own range of frames
const pworkerSrc = `
const lzTable = new Int32Array(1 << 16);
const sleep = ms => new Promise(r => setTimeout(r, ms));
${encodeFrame}
${lz4Block}
${drawRotated}
onmessage = e => run(e.data).catch(err => postMessage({ error: String((err && err.message) || err) }));
async function run(m) {
  const { samples, ts, cfg, w, h, rot, fps, start, f0, f1, keyEvery, tol, rgb, lz4 } = m;
  const ctx = new OffscreenCanvas(w, h).getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  const recon = new Uint8Array(w * h * 4);
  const q = []; let err = null, finished = false, stop = false;
  const dec = new VideoDecoder({ output: f => q.push(f), error: e => { err = e; } });
  dec.configure(cfg);
  (async () => {
    try {
      for (let i = 0; i < samples.length && !err && !stop; i++) {
        while ((dec.decodeQueueSize > 16 || q.length > 8) && !err && !stop) await sleep(2);
        const s = samples[i];
        dec.decode(new EncodedVideoChunk({ type: s.sync ? 'key' : 'delta', timestamp: Math.round(s.cts * 1e6 / ts), duration: Math.round(s.dur * 1e6 / ts), data: s.data }));
      }
      if (!stop) await dec.flush();
    } catch (e) { err = err || e; }
    finished = true;
  })();
  const T = { dec: 0, draw: 0, enc: 0 };
  const next = async () => {
    const t = performance.now();
    for (;;) {
      if (q.length) { T.dec += performance.now() - t; return q.shift(); }
      if (err) throw err;
      if (finished) return null;
      await sleep(1);
    }
  };
  let cur = await next(), nxt = await next();
  if (!cur) throw new Error('no frames decoded');
  let frames = [], raws = [], first = f0;
  for (let n = f0; n < f1; n++) {
    const target = (start + n / fps) * 1e6;
    while (nxt && nxt.timestamp <= target) { cur.close(); cur = nxt; nxt = await next(); }
    let t = performance.now();
    drawRotated(ctx, cur, w, h, rot);
    const px = ctx.getImageData(0, 0, w, h).data;
    T.draw += performance.now() - t; t = performance.now();
    const rec = encodeFrame(px, recon, n % keyEvery === 0, tol, rgb);
    let st = rec;
    if (lz4) { const c = lz4Block(rec); if (c.length < rec.length) st = c.slice(); }
    T.enc += performance.now() - t;
    frames.push(st); raws.push(rec.length);
    if (frames.length === keyEvery || n === f1 - 1) {
      postMessage({ block: first / keyEvery, frames, raws }, frames.map(f => f.buffer));
      frames = []; raws = []; first = n + 1;
    }
  }
  stop = true; cur.close(); if (nxt) nxt.close();
  q.forEach(f => f.close());
  if (dec.state !== 'closed') dec.close();
  postMessage({ done: true, T });
}`;

async function extractFramesParallel(onProgress) {
  const dm = await demux(fileObj);
  const { track, samples, rot } = dm, ts = track.timescale;
  const { w, h } = dims(), { start } = range(), fps = val('fps'), total = frameTotal();
  const keyEvery = Math.max(1, Math.floor(val('keyEvery'))), tol = Math.max(0, val('tol'));
  const rgb = $('rgb').checked, useLz4 = $('lz4').checked;
  const maxPart = Math.max(1, val('partMB')) * 1048576;
  const cfg = { codec: track.codec, codedWidth: track.video.width, codedHeight: track.video.height, description: getDescription(dm.mp4, track) };
  if (!(await VideoDecoder.isConfigSupported(cfg)).supported) throw new Error('decoder config unsupported');
  const nBlocks = Math.ceil(total / keyEvery);
  const W = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 4) - 1, nBlocks));
  const per = Math.ceil(nBlocks / W);

  // source samples a worker needs: from the keyframe before its start to the first keyframe after its end
  const slice = (t0, t1) => {
    let a = 0; samples.forEach((s, i) => { if (s.is_sync && s.cts / ts <= t0) a = i; });
    let b = samples.length;
    for (let i = a + 1; i < samples.length; i++) if (samples[i].is_sync && samples[i].cts / ts > t1) { b = i; break; }
    const out = [], tr = [];
    for (let i = a; i < b; i++) {
      const s = samples[i], d = new Uint8Array(s.data);
      out.push({ sync: s.is_sync, cts: s.cts, dur: s.duration, data: d }); tr.push(d.buffer);
    }
    return { out, tr };
  };

  const offsets = new Uint32Array(total * 3); // [offset in part, stored len, raw len]
  const parts = []; let blobs = [], partBytes = 0, partFirst = 0, bytes = 0, maxRaw = 0;
  const closePart = next => { parts.push({ blob: new Blob(blobs), bytes: partBytes, first: partFirst }); blobs = []; partBytes = 0; partFirst = next; };
  const pending = new Map(); let nextBlock = 0, doneFrames = 0;
  const assemble = () => { // blocks may arrive out of order; append strictly in order, parts split on block boundaries
    while (pending.has(nextBlock)) {
      const b = pending.get(nextBlock); pending.delete(nextBlock);
      const first = nextBlock * keyEvery, size = b.lens.reduce((x, y) => x + y, 0);
      if (partBytes > 0 && partBytes + size > maxPart) closePart(first);
      b.lens.forEach((len, i) => {
        const f = first + i;
        offsets[f * 3] = partBytes; offsets[f * 3 + 1] = len; offsets[f * 3 + 2] = b.raws[i];
        partBytes += len; bytes += len; if (b.raws[i] > maxRaw) maxRaw = b.raws[i];
      });
      blobs.push(b.blob); nextBlock++;
    }
  };

  const url = URL.createObjectURL(new Blob([pworkerSrc], { type: 'text/javascript' }));
  const workers = [], T = { dec: 0, draw: 0, enc: 0 };
  try {
    await new Promise((resolve, reject) => {
      const poll = setInterval(() => { if (cancelled) { clearInterval(poll); reject(new Error('cancelled')); } }, 100);
      const fail = e => { clearInterval(poll); reject(e); };
      let finished = 0;
      for (let k = 0; k < W; k++) {
        const bk0 = k * per, bk1 = Math.min(nBlocks, (k + 1) * per);
        if (bk0 >= bk1) continue;
        const f0 = bk0 * keyEvery, f1 = Math.min(total, bk1 * keyEvery);
        const { out, tr } = slice(start + f0 / fps, start + f1 / fps + 0.5);
        const wk = new Worker(url); workers.push(wk);
        wk.onerror = e => fail(new Error(e.message || 'worker error'));
        wk.onmessage = e => {
          const r = e.data;
          if (r.error) return fail(new Error(r.error));
          if (r.done) {
            T.dec += r.T.dec / 1000; T.draw += r.T.draw / 1000; T.enc += r.T.enc / 1000;
            if (++finished === workers.length) { clearInterval(poll); resolve(); }
            return;
          }
          pending.set(r.block, { blob: new Blob(r.frames), lens: r.frames.map(f => f.byteLength), raws: r.raws });
          doneFrames += r.raws.length; assemble(); onProgress(doneFrames / total);
        };
        wk.postMessage({ samples: out, ts, cfg, w, h, rot, fps, start, f0, f1, keyEvery, tol, rgb, lz4: useLz4 }, tr);
      }
    });
  } finally { workers.forEach(x => x.terminate()); URL.revokeObjectURL(url); }
  if (nextBlock !== nBlocks) throw new Error('missing blocks');
  if (partBytes > 0 || !parts.length) closePart(total);
  return { parts, offsets, bytes, width: w, height: h, count: total, keyEvery, maxRaw, lz4: useLz4, rgb, raw: w * h * 4 * total, wc: true, timing: { ...T, workers: workers.length } };
}

async function extractFrames(onProgress) {
  if (hasWC()) {
    try { return await extractFramesParallel(onProgress); }
    catch (e) {
      if (cancelled || e.message === 'cancelled') throw new Error('cancelled');
      console.warn('parallel path failed, using single thread:', e);
      log('Parallel path failed (' + e.message + '), using single thread…');
    }
  }
  return extractFramesSerial(onProgress);
}

async function extractFramesSerial(onProgress) {
  const { w, h } = dims(), { start } = range(), fps = val('fps'), total = frameTotal();
  const keyEvery = Math.max(1, Math.floor(val('keyEvery'))), tol = Math.max(0, val('tol'));
  const rgb = $('rgb').checked, useLz4 = $('lz4').checked;
  const maxPart = Math.max(1, val('partMB')) * 1048576;
  const cv = new OffscreenCanvas(w, h);
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  const offsets = new Uint32Array(total * 3); // [offset in part, stored len, raw len]
  const parts = []; let blobs = [], batch = [], partBytes = 0, partFirst = 0, bytes = 0, maxRaw = 0, n = 0;
  const flush = () => { if (batch.length) { blobs.push(new Blob(batch)); batch = []; } }; // spill to Blob, keeps heap small
  const closePart = next => { flush(); parts.push({ blob: new Blob(blobs), bytes: partBytes, first: partFirst }); blobs = []; partBytes = 0; partFirst = next; };
  // worker: results come back in order, at most 4 frames in flight
  const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' })));
  let inflight = 0, waiter = null, werr = null;
  const wake = () => { if (waiter) { const r = waiter; waiter = null; r(); } };
  const until = async fn => { while (!fn()) { if (werr) throw werr; await new Promise(r => { waiter = r; }); } if (werr) throw werr; };
  worker.onerror = e => { werr = new Error(e.message || 'worker error'); wake(); };
  worker.onmessage = e => {
    const r = e.data;
    if (r.newPart) closePart(r.n);
    if (r.rawLen > maxRaw) maxRaw = r.rawLen;
    offsets[r.n * 3] = r.offset; offsets[r.n * 3 + 1] = r.stored.length; offsets[r.n * 3 + 2] = r.rawLen;
    partBytes += r.stored.length; bytes += r.stored.length; batch.push(r.stored);
    if (batch.length >= 256) flush();
    inflight--; wake();
  };
  worker.postMessage({ init: true, size: w * h * 4 });

  // WebCodecs source (falls back to seeking if unsupported or demux fails)
  let dm = null, it = null, cur = null, nxt = null;
  if (hasWC()) {
    try {
      dm = await demux(fileObj);
      it = decodeFrames(dm, start);
      cur = (await it.next()).value;
      nxt = (await it.next()).value;
      if (!cur) throw new Error('no frames');
    } catch (e) {
      dm = null;
      if (cur) { cur.close(); cur = null; }
      if (nxt) { nxt.close(); nxt = null; }
      if (it) { try { await it.return(); } catch {} it = null; }
    }
  }

  let lastYield = performance.now();
  try {
    for (; n < total; n++) {
      if (cancelled) throw new Error('cancelled');
      if (dm) {
        const target = (start + n / fps) * 1e6;
        while (nxt && nxt.timestamp <= target) {
          cur.close(); cur = nxt; nxt = (await it.next()).value;
        }
        drawRotated(ctx, cur, w, h, dm.rot);
      } else {
        await seek(start + n / fps + 0.0005);
        ctx.drawImage(v, 0, 0, w, h);
      }
      const px = ctx.getImageData(0, 0, w, h).data;
      await until(() => inflight < 4);
      inflight++;
      worker.postMessage({ n, buf: px.buffer, key: n % keyEvery === 0, tol, rgb, lz4: useLz4, maxPart }, [px.buffer]);
      if (performance.now() - lastYield > 100) { onProgress(n / total); await yieldUI(); lastYield = performance.now(); }
    }
    await until(() => inflight === 0);
  } finally {
    worker.terminate();
    if (cur) cur.close();
    if (nxt) nxt.close();
    if (it) { try { await it.return(); } catch {} }
  }
  if (partBytes > 0 || !parts.length) closePart(n);
  return { parts, offsets, bytes, width: w, height: h, count: n, keyEvery, maxRaw, lz4: useLz4, rgb, raw: w * h * 4 * n, wc: !!dm };
}

// ---------- audio -> mp3
async function extractMp3() {
  const ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
  let buf;
  try { buf = await ac.decodeAudioData(await fileObj.arrayBuffer()); }
  catch { await ac.close(); return null; }
  await ac.close();
  const sr = buf.sampleRate;
  const { start } = range(), fps = val('fps');
  const frames = frameTotal();
  const endT = Math.min(range().end, start + frames / fps);
  const a = Math.floor(start * sr), b = Math.min(buf.length, Math.floor(endT * sr));
  if (b <= a) return null;
  const mono = $('mono').checked || buf.numberOfChannels === 1;
  const ch = mono ? 1 : 2;
  const L = buf.getChannelData(0).subarray(a, b);
  const R = mono ? null : buf.getChannelData(Math.min(1, buf.numberOfChannels - 1)).subarray(a, b);
  const enc = new lamejs.Mp3Encoder(ch, sr, Math.max(32, Math.min(320, Math.round(val('bitrate')))));
  const toI16 = (src, i, n, m) => {
    const o = new Int16Array(n);
    for (let k = 0; k < n; k++) {
      let s = src[i + k];
      if (m) s = (s + m[i + k]) / 2;
      o[k] = Math.max(-1, Math.min(1, s)) * 32767;
    }
    return o;
  };
  const parts = [], BLOCK = 1152 * 20;
  for (let i = 0; i < L.length; i += BLOCK) {
    if (cancelled) throw new Error('cancelled');
    const n = Math.min(BLOCK, L.length - i);
    const out = mono
      ? enc.encodeBuffer(toI16(L, i, n, buf.numberOfChannels > 1 && $('mono').checked ? buf.getChannelData(1).subarray(a, b) : null))
      : enc.encodeBuffer(toI16(L, i, n), toI16(R, i, n));
    if (out.length) parts.push(new Uint8Array(out));
    if ((i / BLOCK) % 10 === 0) await yieldUI();
  }
  const tail = enc.flush(); if (tail.length) parts.push(new Uint8Array(tail));
  return new Blob(parts, { type: 'audio/mpeg' });
}

// ---------- ZIP (store-only, no compression, no library)
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
async function crc32(blob) {
  let c = 0xFFFFFFFF;
  const r = blob.stream().getReader();
  for (;;) {
    const { done, value } = await r.read(); if (done) break;
    for (let i = 0; i < value.length; i++) c = CRC_T[(c ^ value[i]) & 255] ^ (c >>> 8);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function makeZip(files) {
  const enc = new TextEncoder(), d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = []; let offset = 0, cdSize = 0;
  for (const f of files) {
    const size = f.blob.size;
    if (size > 0xFFFF0000 || offset + size > 0xFFFF0000) throw new Error('Too large for a ZIP (4 GB limit). Lower width, FPS or length.');
    const crc = await crc32(f.blob), name = enc.encode(f.name);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, f.blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    cdSize += 46 + name.length; offset += 30 + name.length + size;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

// ---------- run
function addDl(blob, name) {
  const a = document.createElement('a');
  a.className = 'dl'; a.href = URL.createObjectURL(blob); a.download = name;
  a.textContent = `${name} (${mb(blob.size)})`;
  $('out').appendChild(a);
}

$('go').addEventListener('click', async () => {
  cancelled = false; $('out').innerHTML = '';
  $('go').disabled = true; $('stop').disabled = false; $('bar').hidden = false; $('bar').value = 0;
  try {
    const total = frameTotal();
    if (!total) throw new Error('No frames in the selected range.');
    const t0 = performance.now();
    const fr = await extractFrames(p => {
      $('bar').value = p;
      log(`Extracting frames… ${Math.min(total, Math.round(p * total))} / ${total} (${(p * 100).toFixed(0)}%) · ${((performance.now() - t0) / 1000).toFixed(1)}s elapsed`);
    });
    const tFrames = (performance.now() - t0) / 1000;

    let audio = null;
    if ($('audio').checked) { log('Encoding MP3…'); $('bar').removeAttribute('value'); audio = await extractMp3(); }

    const one = fr.parts.length === 1;
    const pname = i => one ? 'video.bin' : `video_${String(i + 1).padStart(3, '0')}.bin`;
    const meta = {
      format: fr.rgb ? 'rgb8-delta3' : 'rgba8-delta3', rgb: fr.rgb, width: fr.width, height: fr.height,
      lz4: fr.lz4, maxRaw: fr.maxRaw, count: fr.count, fps: val('fps'), keyEvery: fr.keyEvery,
      videoBytes: fr.bytes,
      parts: fr.parts.map((p, i) => ({ name: pname(i), firstFrame: p.first, bytes: p.bytes })),
      hasAudio: !!audio, audioBytes: audio ? audio.size : 0, bitrate: Math.round(val('bitrate')),
    };
    const files = fr.parts.map((p, i) => ({ name: pname(i), blob: p.blob }));
    files.push({ name: 'index.bin', blob: new Blob([fr.offsets.buffer]) });
    if (audio) files.push({ name: 'audio.mp3', blob: audio });
    files.push({ name: 'meta.json', blob: new Blob([JSON.stringify(meta)], { type: 'application/json' }) });
    if ($('zip').checked) {
      log('Making ZIP…'); $('bar').removeAttribute('value');
      addDl(await makeZip(files), 'video-data.zip');
    }
    files.forEach(f => addDl(f.blob, f.name));
    log(`Done in ${((performance.now() - t0) / 1000).toFixed(1)}s (frames: ${tFrames.toFixed(1)}s, ${(fr.count / tFrames).toFixed(1)} fps) · ${fr.count} / ${total} frames ${fr.width}×${fr.height} · ${fr.parts.length} part(s) · ${fr.wc ? 'WebCodecs' : 'seek'} decode\n` +
        (fr.timing ? `cpu-s over ${fr.timing.workers} workers: decode-wait ${fr.timing.dec.toFixed(1)} · draw ${fr.timing.draw.toFixed(1)} · encode ${fr.timing.enc.toFixed(1)}\n` : '') +
        `video ${mb(fr.bytes)} vs ${mb(fr.raw)} raw RGBA (${(fr.raw / Math.max(1, fr.bytes)).toFixed(1)}x smaller)` +
        (audio ? '' : $('audio').checked ? '\nNo audio track found' : ''));
  } catch (e) {
    log(e.message === 'cancelled' ? 'Cancelled.' : 'Error: ' + e.message);
  } finally {
    $('go').disabled = false; $('stop').disabled = true; $('bar').hidden = true;
  }
});
$('stop').addEventListener('click', () => { cancelled = true; });
</script>
