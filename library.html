<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title>
<style>
  :root { --bg:#14161a; --card:#1d2026; --fg:#e8eaed; --mut:#9aa0a6; --acc:#4f8cff; --bd:#2c3038; --err:#ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f5f7; --card:#fff; --fg:#1b1d21; --mut:#6b7280; --bd:#dcdfe4; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; display:grid; gap:12px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  h1 { font-size:18px; margin:0; }
  a.nav { color:var(--acc); text-decoration:none; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .full { grid-column:1 / -1; }
  label { display:grid; gap:4px; font-size:12px; color:var(--mut); }
  select { width:100%; padding:8px; border-radius:6px; border:1px solid var(--bd); background:var(--bg); color:var(--fg); font-size:14px; }
  .thumb { width:56px; height:56px; flex:none; border-radius:8px; border:1px solid var(--bd); background:var(--bg); object-fit:cover; display:grid; place-items:center; color:var(--mut); }
  div.thumb svg { width:24px; height:24px; opacity:.6; }
  img.thumb { cursor:pointer; }
  .grp { font-size:12px; color:var(--mut); margin:6px 2px 0; }
  input[type=text], input[type=password], input[type=search] { width:100%; padding:8px; border-radius:6px; border:1px solid var(--bd); background:var(--bg); color:var(--fg); font-size:14px; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--acc); color:#fff; font-size:15px; cursor:pointer; }
  button.sec { background:var(--bd); color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  details summary { cursor:pointer; font-size:14px; }
  #status { font-size:12px; color:var(--mut); white-space:pre-wrap; }
  #status.err { color:var(--err); }
  .item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card); border:1px solid var(--bd); border-radius:10px; }
  .item .name { flex:1; min-width:0; word-break:break-all; }
  .item .size { font-size:12px; color:var(--mut); white-space:nowrap; }
  .item button { padding:8px 12px; font-size:14px; white-space:nowrap; min-width:92px; }
  #list { display:grid; gap:8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Library</h1>
    <a class="nav" href="./?converter">← Converter</a>
  </header>

  <details class="card" id="cfg">
    <summary>Source settings</summary>
    <div class="grid" style="margin-top:10px">
      <label class="full">GitHub repo (owner/name)<input type="text" id="repo" placeholder="username/my-repo" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <label class="full">Source
        <select id="mode">
          <option value="folder">Repo folder</option>
          <option value="releases">GitHub Releases</option>
        </select>
      </label>
      <label>Folder in repo (folder mode)<input type="text" id="path" placeholder="zips (blank = root)" autocapitalize="off" spellcheck="false"></label>
      <label>Branch (folder mode, blank = default)<input type="text" id="branch" placeholder="main" autocapitalize="off" spellcheck="false"></label>
      <label class="full">Release tag (releases mode, blank = all releases)<input type="text" id="tag" placeholder="v1.0 or latest" autocapitalize="off" spellcheck="false"></label>
      <label class="full">Access token (optional, only for private repos / rate limits)<input type="password" id="token" placeholder="ghp_…" autocomplete="off"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="save">Save &amp; load</button>
    </div>
  </details>

  <div class="row">
    <input type="search" id="q" placeholder="Filter…" style="flex:1">
    <button class="sec" id="reload">Reload</button>
  </div>
  <div id="status"></div>
  <div id="list"></div>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'library.cfg';
const mb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const setStatus = (t, err) => { $('status').textContent = t; $('status').className = err ? 'err' : ''; };

// Defaults can be changed here, in the settings box, or via the URL: library.html?repo=owner/name&path=zips&branch=main
const DEFAULTS = { repo: 'BloxinStud10/Video-Decoder', mode: 'releases', path: '', branch: '', tag: '', token: '' };
let cfg = { ...DEFAULTS };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
const qp = new URLSearchParams(location.search);
['repo', 'mode', 'path', 'branch', 'tag'].forEach(k => { if (qp.has(k)) cfg[k] = qp.get(k); });

let items = [];
const IMG = /\.(png|jpe?g|gif|webp|avif|bmp)$/i;
const stem = n => n.replace(/\.[^.]+$/, '').toLowerCase();
// Preview for a zip: an image with the same base name (foo.zip ↔ foo.png), otherwise the first image in the release.
function pickThumb(zipName, imgs, urlOf, exactOnly) {
  const s = stem(zipName);
  const hit = imgs.find(i => stem(i.name) === s) || (exactOnly ? null : imgs[0]);
  return hit ? urlOf(hit) : null;
}
const PLACEHOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>';
function makeThumb(url) {
  const ph = () => { const d = document.createElement('div'); d.className = 'thumb'; d.innerHTML = PLACEHOLDER; return d; };
  if (!url) return ph();
  const img = document.createElement('img');
  img.className = 'thumb'; img.loading = 'lazy'; img.alt = ''; img.src = url; img.title = 'Open preview';
  img.addEventListener('click', () => window.open(url, '_blank'));
  img.addEventListener('error', () => img.replaceWith(ph()));
  return img;
}

function fill() { ['repo', 'mode', 'path', 'branch', 'tag', 'token'].forEach(k => { $(k).value = cfg[k] || ''; }); }
function readForm() {
  cfg.repo = $('repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/^\/|\/$/g, '');
  cfg.mode = $('mode').value;
  cfg.tag = $('tag').value.trim();
  cfg.path = $('path').value.trim().replace(/^\/|\/$/g, '');
  cfg.branch = $('branch').value.trim();
  cfg.token = $('token').value.trim();
  try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch {}
}
const headers = () => {
  const h = { Accept: 'application/vnd.github+json' };
  if (cfg.token) h.Authorization = 'Bearer ' + cfg.token;
  return h;
};

async function load() {
  $('list').innerHTML = ''; items = [];
  if (!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo)) {
    $('cfg').open = true;
    setStatus('Enter a repo as owner/name in Source settings.');
    return;
  }
  setStatus('Loading…');
  const rel = cfg.mode === 'releases';
  const base = `https://api.github.com/repos/${cfg.repo}`;
  const api = rel
    ? (cfg.tag === 'latest' ? `${base}/releases/latest`
       : cfg.tag ? `${base}/releases/tags/${encodeURIComponent(cfg.tag)}`
       : `${base}/releases?per_page=100`)
    : `${base}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}` +
      (cfg.branch ? `?ref=${encodeURIComponent(cfg.branch)}` : '');
  try {
    const r = await fetch(api, { headers: headers() });
    if (!r.ok) {
      let msg = `GitHub returned ${r.status}.`;
      if (r.status === 404) msg += ' Repo, folder or branch not found (private repos need a token).';
      else if (r.status === 403 || r.status === 429) msg += ' Rate limit hit — add an access token or wait a bit.';
      else if (r.status === 401) msg += ' Token rejected.';
      throw new Error(msg);
    }
    const data = await r.json();
    if (rel) {
      const releases = Array.isArray(data) ? data : [data];
      releases.forEach(rl => {
        const assets = rl.assets || [], imgs = assets.filter(a => IMG.test(a.name));
        // images pasted/dragged into the release notes (markdown ![](url) or <img src="url">)
        const bm = (rl.body || '').match(/!\[[^\]]*\]\(\s*<?([^)\s>]+)|<img[^>]+src=["']([^"']+)["']/i);
        const bodyImg = bm ? (bm[1] || bm[2]) : null;
        assets.forEach(a => {
          if (!/\.zip$/i.test(a.name)) return;
          items.push({ name: a.name, size: a.size, url: a.url, download_url: a.browser_download_url, release: true,
                       group: rl.name || rl.tag_name, tag: rl.tag_name,
                       thumb: pickThumb(a.name, imgs, i => i.browser_download_url, true) || bodyImg || pickThumb(a.name, imgs, i => i.browser_download_url) });
        });
      });
      setStatus(items.length ? `${items.length} zip asset${items.length === 1 ? '' : 's'} in ${releases.length} release${releases.length === 1 ? '' : 's'} of ${cfg.repo}` : 'No .zip assets found in the releases.');
    } else {
      if (!Array.isArray(data)) throw new Error('That path is a file, not a folder.');
      const imgs = data.filter(f => f.type === 'file' && IMG.test(f.name));
      items = data.filter(f => f.type === 'file' && /\.zip$/i.test(f.name))
                  .map(f => ({ ...f, thumb: pickThumb(f.name, imgs, i => i.download_url, true) }))
                  .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      setStatus(items.length ? `${items.length} zip file${items.length === 1 ? '' : 's'} in ${cfg.repo}/${cfg.path}` : 'No .zip files found in that folder.');
    }
    render();
  } catch (e) {
    setStatus(e.message || String(e), true);
  }
}

function render() {
  const f = $('q').value.trim().toLowerCase();
  const list = $('list'); list.innerHTML = '';
  let lastGroup = null;
  items.filter(x => (x.name + ' ' + (x.group || '')).toLowerCase().includes(f)).forEach(x => {
    if (x.group && x.group !== lastGroup) {
      const g = document.createElement('div'); g.className = 'grp'; g.textContent = x.group; list.appendChild(g);
      lastGroup = x.group;
    }
    const row = document.createElement('div'); row.className = 'item';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = x.name.replace(/\.zip$/i, ''); name.title = x.name;
    const size = document.createElement('div'); size.className = 'size'; size.textContent = mb(x.size);
    const btn = document.createElement('button'); btn.textContent = 'Download';
    btn.addEventListener('click', () => download(x, btn));
    row.append(makeThumb(x.thumb), name, size, btn);
    list.appendChild(row);
  });
}

function save(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

async function download(x, btn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = '0%';
  try {
    // private repos: the API URL with the raw media type works with a token; public: download_url
    // release assets: browser_download_url has no CORS, so use the API asset URL (it redirects to a CORS-enabled signed URL)
    const useApi = !!cfg.token || x.release;
    const r = await fetch(useApi ? x.url : x.download_url, useApi ? { headers: { ...headers(), Accept: x.release ? 'application/octet-stream' : 'application/vnd.github.raw+json' } } : {});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const total = x.size || +r.headers.get('content-length') || 0;
    const rd = r.body.getReader(), chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      chunks.push(value); got += value.length;
      if (total) btn.textContent = Math.min(99, Math.round(got / total * 100)) + '%';
    }
    save(new Blob(chunks, { type: 'application/zip' }), x.name);
    btn.textContent = 'Done';
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1500);
  } catch (e) {
    // fallback: plain navigation to the file URL
    setStatus(`Direct download failed (${e.message}), opening the link instead.`, true);
    if (x.download_url && (x.release || !cfg.token)) window.open(x.download_url, '_blank');
    btn.textContent = old; btn.disabled = false;
  }
}

$('save').addEventListener('click', () => { readForm(); $('cfg').open = false; load(); });
$('reload').addEventListener('click', () => { readForm(); load(); });
$('q').addEventListener('input', render);
fill(); load();
</script>
</body>
</html>
